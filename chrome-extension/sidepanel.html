<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VeriCargo</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <img class="brand-logo" src="assets/vericargo-full.png" alt="VeriCargo" />
      <span class="local-badge">Cloud</span>
      <div id="connection-status" class="connection-status"></div>
    </header>

    <nav class="app-tabs" aria-label="VeriCargo views">
      <button class="app-tab active" data-view="summary" type="button">Inbox Summary</button>
      <button class="app-tab" data-view="cases" type="button">My Cases</button>
      <button class="app-tab" data-view="comparison" type="button">SI/BL Document Comparison</button>
      <button class="app-tab" data-view="human-review" type="button">Human Review</button>
    </nav>

    <main>
      <section id="summary-view" class="app-view" aria-label="Inbox summary">
        <div id="classification-status" class="classification-status"></div>
        <section id="summary-dashboard" class="summary-dashboard"></section>
        <div id="document-status" class="document-status"></div>
        <section id="document-workflow-dashboard" class="document-workflow-dashboard"></section>
      </section>

      <section id="cases-view" class="app-view" aria-label="My cases" hidden>
        <div class="case-toolbar">
          <label class="case-search">
            <span aria-hidden="true">&#128269;</span>
            <input id="case-search" type="search" placeholder="Search sender, subject, content or files" autocomplete="off" />
          </label>
          <div id="category-filters" class="category-filters" aria-label="Filter cases by category"></div>
          <div id="case-result-count" class="case-result-count" aria-live="polite"></div>
        </div>
        <div class="cases-layout">
          <div class="case-list-column">
            <section id="inbox" class="inbox" aria-label="Shipping email inbox"></section>
            <nav id="pagination" class="pagination" aria-label="Email pages"></nav>
          </div>
          <section id="detail" class="detail" aria-live="polite"></section>
        </div>
      </section>

      <section id="human-review-view" class="app-view" aria-label="Human review" hidden>
        <div id="human-review-filters" class="human-review-filters" aria-label="Filter human review cases"></div>
        <div class="human-review-layout">
          <div class="human-review-list-column">
            <section id="human-review-list" class="human-review-list" aria-label="Human review email list"></section>
            <nav id="human-review-pagination" class="pagination" aria-label="Human review email pages"></nav>
          </div>
          <section id="human-review-detail" class="human-review-detail" aria-live="polite"></section>
        </div>
      </section>

      <section id="comparison-view" class="app-view" aria-label="SI and Draft BL document comparison" hidden>
        <div class="comparison-layout">
          <div class="comparison-list-column">
            <aside id="comparison-list" class="comparison-list" aria-label="Processed document cases"></aside>
            <nav id="comparison-pagination" class="pagination" aria-label="Processed document case pages"></nav>
          </div>
          <section id="comparison-detail" class="comparison-detail" aria-live="polite"></section>
        </div>
      </section>
    </main>

    <template id="empty-state">
      <div class="empty-state">
        <div class="empty-icon">&#9993;</div>
        <h2>Select an email</h2>
        <p>Open a case to view classification, comparison, and evidence.</p>
      </div>
    </template>

    <script src="cloud-client.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
